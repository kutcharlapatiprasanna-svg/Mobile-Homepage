<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>

<body>
    <div id="root">
        <div id="top">
            <button class="material-icons menu btn" onclick="toggleMenu()">menu</button>
            <div class="options" id="actionbuttons">
                <button id="freehand" class="btn material-icons" onclick="onActionClick(this)">edit</button>
                <button id="circle" class="btn material-symbols-outlined" onclick="onActionClick(this)">brightness_1</button>
                <button id="rectangle" class="btn material-symbols-outlined" onclick="onActionClick(this)">
                    check_box_outline_blank</button>
                <button id="earaser" class="btn material-symbols-outlined" onclick="onActionClick(this)">ink_eraser</button>
                <!-- colorpicker -->
                <!-- <input type="color" id="color-picker">
                 onclick="enableRectDrawing()"
                 -->
            </div>
            <div></div>
        </div>
        <canvas id="canvas" width="500" height="600"></canvas>
        <div id="bottom">
            <div class="options">
                <button class="btn material-icons" id="undo">undo</button>
                <button class="btn material-icons" id="redo">redo</button>
            </div>
        </div>

    </div>
    <div class="form hide">
        <label for="strokeWidth">Stroke Width</label>
        <input type="range" id="strokeWidth" name="strokeWidth" min="3" max="10" id="strokeWidth"
            oninput="onInput(this)">
        <label for="strokeStyle">Stroke Style</label>
        <input type="color" id="strokeStyle" name="strokeStyle" oninput="onInput(this)">
    </div>



    <!-- <script src="freehand.js"></script>
    <script src="undoredo.js"></script>
    <script src="script.js"></script> -->

    <script src="state.js"></script>
</body>

</html>
