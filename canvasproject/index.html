<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
</head>

<body>
    <!-- first root div-->
    <div id="root">
        <div id="top">
            <button class="material-icons menu">menu</button>
            <div class="options">
                <button class="material-icons">edit</button>
                <button class="material-symbols-outlined">brightness_1</button>
                <button class="material-symbols-outlined">check_box_outline_blank</button>
                <button class="material-symbols-outlined">ink_eraser</button>
            </div>
        </div>
        <canvas id="canvas" width="500" height="400"></canvas>
        <div id="bottom">
            <div>
                <button class="material-icons">undo</button>
                <button class="material-icons">redo</button>
            </div>
        </div>

    </div>
    <script src="script.js"></script>
</body>

</html>
