<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
        integrity="sha512-DxV+EoADOkOygM4IR9yXP8Sb2qwgidEmeqAEmDKIOfPRQZOWbXCzLC6vjbZyy0vPisbH2SyW27+ddLVCN+OMzQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- box-1 -->
    <div class="box-1">
        <h1 class="heading-1">Silver Sport 2 Wheelchair</h1>
        <div class="wheelchair-img">
            <img class="box-1Img" src="img/wheelchair.jpg" alt="Wheelchair">
        </div>
        <h4 class="heading-2">$262.23</h4>

        <div class="items-space">
            <p>Item # SSP218DDA-ELR</p>
            <div class="icons">
`                <i class="fa-regular fa-heart"></i>
                <i class="fa-solid fa-share-nodes"></i>
            </div>
        </div>
        <div class="upc">
            <span class="upc-1">UPC # 822383140414</span>
            <span class="upc-2">HCPCS # E4002</span>
        </div>

        <!-- <i class="fa-solid fa-angle-left"></i>
            <i class="fa-regular fa-heart"></i> -->
    </div>
    <!-- box-2-->
    <div class="box-2">
        <h5 class="heading-3">Color</h5>
        <div class="color-types">
            <button type="button" class="color-1"></button>
            <button type="button" class="color-2"></button>
            <button type="button" class="color-3"></button>
        </div>
        <div class="button-types">
            <h4>Seat Size</h4>
            <button type="button">16"</button>
            <button type="button">18"</button>
            <button type="button">20"</button>
        </div>
        <div class="arm-type">
            <h4>Arm Style </h4>
            <button type="button">Desk</button>
            <button type="button">Full</button>
        </div>
        <div class="front-type">
            <h4>Front Rigging</h4>
            <button type="button">Footrests</button>
            <button type="button">Legrests</button>
        </div>

    </div>
    <!-- box-3 -->
    <div>
        <h2 class="price">$262.23 <span class="stock">In Stock</span></h2>
        <p>Deliver to <a href="#">Chris - Huntington 11743</a></p>
        <p>Est Delivery Date: <span class="delivery-date">11/10/24</span></p>
        <button class="add-to-cart">Add to Cart</button>
    </div>
    <!-- box-4--->
    <div class="final-box">
        <p> Product Options</p>
        <p>Features</p>
        <p>Specifications</p>
        <p>Resources/Downloads</p>
        <p>Accessories</p>
    </div>

</body>
